name: Flake CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Run flake checks
        run: nix flake check --print-build-logs

      - name: Build sway VM test
        run: nix build .#checks.x86_64-linux.workstation-sway -o result-sway

      - name: Upload VM test screenshots
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-screenshots
          path: result-sway/*.png
          if-no-files-found: warn